specVersion: 0.0.2
description: CherrySwap is a decentralized protocol for automated token exchange on OkChain Smart Chain.
repository: https://github.com/cherryswap/cherryswap-subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: Account_token_holder
    network: mainnet
    source:
      address: '0x14926fEAceB63E4C58eB4fA88BD9D5db772EfbE3'
      abi: ERC20
      startBlock: 4563801
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      file: ./src/mappings/accountTokenHolder.ts
      entities:
        - Account_Token_Hold
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
# templates:
  - kind: ethereum/contract
    name: CheCheWithDraw
    network: mainnet
    source:
      address: '0x3a0ee415d18ed146b7d3c5f82284c2a14496d7db'
      abi: SingleSmartChef
      startBlock: 4563801
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.4
      language: wasm/assemblyscript
      file: ./src/mappings/accountTokenHolder.ts
      entities:
        - Account_Token_Hold
      abis:
        - name: SingleSmartChef
          file: ./abis/SingleSmartChef.json
      eventHandlers:
        - event: Withdraw(indexed address,uint256)
          handler: handleWithDraw
